aid: games24x7
name: Games24x7
description: 'Games24x7 is a Mumbai-headquartered Indian online skill-gaming company
  founded in 2006 by Bhavin Pandya and Trivikraman Thampy, operating consumer real-money
  and casual gaming platforms rather than a developer API business. Its portfolio spans
  RummyCircle (online rummy), My11Circle (fantasy cricket, football, kabaddi and ludo)
  and Wowzy (a three-dice ludo variant), backed by Tiger Global, The Raine Group and
  Malabar Investment. The company publishes engineering writing on distributed systems,
  Cassandra, Amazon Aurora, ksqlDB and React Native through its Resources section, runs
  the TechXpedite accelerator, and maintains a small public GitHub organization
  (games24x7-opensource) plus one first-party npm package for AI-assisted Appium test
  automation. As of August 2026 it publishes no developer portal, no API documentation,
  no machine-readable specification, and no partner or affiliate API of its own.'
